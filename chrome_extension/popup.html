<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContentForge AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">🚀 ContentForge AI</div>
            <div class="subtitle">Extractor Profesional</div>
        </header>

        <div class="status-bar" id="statusBar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Verificando conexión...</span>
        </div>

        <!-- Platform Detection -->
        <div class="platform-info" id="platformInfo">
            <span id="platformIcon">🌐</span>
            <span id="platformName">Detectando plataforma...</span>
        </div>

        <!-- Extraction Options -->
        <div class="options-panel">
            <div class="options-title">⚙️ Opciones de Extracción</div>
            <div class="options-grid">
                <label class="option-item">
                    <input type="checkbox" id="optTitle" checked>
                    <span>📝 Título y Descripción</span>
                </label>
                <label class="option-item">
                    <input type="checkbox" id="optHashtags" checked>
                    <span>#️⃣ Hashtags</span>
                </label>
                <label class="option-item">
                    <input type="checkbox" id="optStats" checked>
                    <span>📊 Estadísticas</span>
                </label>
                <label class="option-item">
                    <input type="checkbox" id="optComments">
                    <span>💬 Comentarios</span>
                </label>
            </div>
        </div>

        <!-- Content Preview -->
        <div class="content-preview" id="contentPreview">
            <div class="preview-header">
                <div class="preview-title" id="previewTitle">Título del contenido</div>
                <div class="preview-url" id="previewUrl">URL actual</div>
            </div>
            <div class="preview-stats" id="previewStats" style="display: none;">
                <span class="stat">❤️ <span id="statLikes">0</span></span>
                <span class="stat">💬 <span id="statComments">0</span></span>
                <span class="stat">🔄 <span id="statShares">0</span></span>
                <span class="stat">👁️ <span id="statViews">0</span></span>
            </div>
            <div class="preview-text" id="previewText">Haz clic en "Extraer" para obtener el contenido...</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="extractBtn">
                📥 Extraer Contenido
            </button>
            <button class="btn btn-secondary" id="sendBtn" disabled>
                🚀 Enviar a ContentForge
            </button>
        </div>

        <div class="actions">
            <button class="btn btn-analyze" id="analyzeMediaBtn">
                🎬 Analizar Media (Video/Imagen)
            </button>
        </div>

        <div class="result" id="result" style="display: none;">
            <div class="result-icon">✅</div>
            <div class="result-text">Contenido enviado correctamente</div>
        </div>

        <footer>
            <span id="extractedInfo">Sin datos extraídos</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
